[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-atlas-registration"
version = "0.1.0"
description = "Napari plugin for atlas rotation, BigWarp integration, and coordinate mapping"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "napari>=0.4.18",
    "numpy>=1.24",
    "scipy>=1.10",
    "SimpleITK>=2.3.0",
    "tifffile>=2023.1.1",
    "imageio>=2.28",
    "Pillow>=9.0",
    "nibabel>=5.0",
    "scikit-image>=0.21",
    "pandas>=2.0",
    "magicgui>=0.7",
    "qtpy",
    "PyQt6",
]

[project.optional-dependencies]
czi = ["czifile"]
nd2 = ["nd2"]
dev = ["pytest", "pytest-qt", "napari[testing]"]

[project.entry-points."napari.manifest"]
napari-atlas-registration = "napari_atlas_registration:napari.yaml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# include napari manifest
napari_atlas_registration = ["napari.yaml"]

[tool.uv]
dev-dependencies = [
    "pytest",
    "pytest-qt",
    "napari[testing]",
]
